<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<title>录制 · EvoX</title>
<link rel="icon" href="/img/favicon-32.png">
<link rel="stylesheet" href="/css/console.css">
<link rel="stylesheet" href="/css/recording.css">
</head>
<body class="record-page">
<main class="recorder">
  <header class="recorder-header"><div><span class="recorder-brand">EvoX</span><h1>录制</h1></div><a id="consoleLink" href="/">控制台 ↗</a></header>
  <div class="recorder-context"><span id="recordConnection" role="status">正在连接…</span><span>前20秒 + 后10秒</span></div>
  <section aria-labelledby="recordResultsTitle"><div class="record-results-heading"><h2 id="recordResultsTitle">录包结果</h2><span id="recordCount"></span></div><p id="recordListStatus" class="voice-status" role="status">读取录包结果…</p><div id="recordResults" class="record-results"></div></section>
</main>
<footer class="record-dock">
  <div class="voice-controls"><label for="voiceSeconds">语音备注 <input id="voiceSeconds" type="number" min="1" max="20" step="1" value="5" inputmode="numeric"> 秒</label><span>1–20秒</span></div>
  <p class="voice-status" id="voiceStatus" role="status" aria-live="polite"></p>
  <div class="voice-recovery"><button id="voiceRetry" hidden>重试保存语音</button><a id="voiceDownload" hidden>下载本地语音</a><button id="voiceDiscard" hidden>结束本次语音处理</button></div>
  <button id="recordButton" class="record-shutter" type="button" disabled aria-label="保存前20秒和后10秒，并录制语音备注" aria-keyshortcuts="Shift+Enter"><span aria-hidden="true"></span></button>
  <p id="recordHint" class="record-hint">等待连接</p>
</footer>
<script type="module" src="/js/record-page.js"></script>
</body>
</html>

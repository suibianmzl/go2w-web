<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EvoX Fleet · 云端访问验证</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/favicon-180.png">
  <style>
    :root{
      color-scheme:light;
      --bg:#f1f1f3;
      --panel:#fff;
      --line:#e7e7eb;
      --line-2:#dcdce2;
      --fg:#27272a;
      --fg-2:#65656f;
      --muted:#85858f;
      --accent:#35353b;
      --green:#168354;
      --danger:#ac4444;
      --display:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:var(--bg);
      color:var(--fg);
      font:14px/1.55 var(--display);
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid #787880;outline-offset:3px}
    .topbar{
      height:68px;
      flex:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:0 28px;
      background:#18181b;
      color:#fff;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:#fff}
    .brand strong{font-size:25px;line-height:1;font-weight:700;letter-spacing:-1px}
    .brand>i{width:1px;height:30px;background:#44444c}
    .brand span{font-size:15px;font-weight:400;white-space:nowrap}
    .secure-chip{
      display:flex;
      align-items:center;
      gap:8px;
      height:29px;
      padding:0 10px;
      border:1px solid #3a3a41;
      border-radius:8px;
      background:#26262b;
      color:#aaaab4;
      font-size:12px;
      white-space:nowrap;
    }
    .secure-chip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
    .page{
      flex:1;
      display:grid;
      place-items:center;
      padding:32px 24px 48px;
    }
    main{
      width:min(440px,100%);
      padding:32px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      box-shadow:0 18px 60px rgba(24,24,27,.08);
    }
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
    h1{margin:0 0 8px;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
    .intro{margin:0;color:var(--muted);font-size:13px}
    .pill{
      flex:none;
      display:inline-flex;
      align-items:center;
      min-height:25px;
      padding:3px 10px;
      border:1px solid #cfe6da;
      border-radius:999px;
      background:#f0f8f3;
      color:var(--green);
      font-size:12px;
      white-space:nowrap;
    }
    label{display:block;margin-bottom:8px;color:var(--fg-2);font-size:13px}
    .field{position:relative}
    input{
      width:100%;
      height:46px;
      padding:0 14px;
      border:1px solid var(--line-2);
      border-radius:8px;
      outline:none;
      background:#fafafa;
      color:var(--fg);
      transition:border-color .15s,box-shadow .15s,background .15s;
    }
    input::placeholder{color:#a0a0aa}
    input:hover{border-color:#cfcfd7}
    input:focus{border-color:#8f8f98;background:#fff;box-shadow:0 0 0 3px rgba(53,53,59,.08)}
    button[type="submit"]{
      width:100%;
      height:44px;
      margin-top:16px;
      border:1px solid #27272a;
      border-radius:8px;
      background:#27272a;
      color:#fff;
      font-weight:500;
      transition:background .15s,border-color .15s,opacity .15s;
    }
    button[type="submit"]:hover{background:#3a3a40;border-color:#3a3a40}
    button[type="submit"]:disabled{cursor:wait;opacity:.55}
    #error{min-height:22px;margin:9px 0 0;color:var(--danger);font-size:12px}
    .status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-top:22px;
      padding-top:16px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:11px;
    }
    .status span:first-child{display:flex;align-items:center;gap:7px}
    .status span:first-child:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
    .status span:last-child{font-family:var(--mono)}
    @media(max-width:560px){
      .topbar{height:62px;padding:10px 14px}
      .brand span{font-size:14px}
      .secure-chip{display:none}
      .page{padding:20px 14px 32px}
      main{padding:24px 20px}
      h1{font-size:21px}
      .card-head{flex-direction:column}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/login" aria-label="EvoX 云端访问验证">
      <strong>Evo<span>X</span></strong>
      <i></i>
      <span>Go2W 云端控制</span>
    </a>
    <div class="secure-chip">安全访问</div>
  </header>

  <div class="page">
    <main>
      <div class="card-head">
        <div>
          <h1>云端访问验证</h1>
          <p class="intro">请输入云端访问 Token，验证通过后可进入设备列表、控制台和巡检中心。</p>
        </div>
        <span class="pill">Token 验证</span>
      </div>

      <form id="loginForm">
        <label for="token">访问 Token</label>
        <div class="field">
          <input id="token" name="token" type="password" autocomplete="current-password"
            placeholder="请输入云端访问 Token" autofocus required>
        </div>
        <button id="submit" type="submit">验证并进入</button>
        <div id="error" role="alert"></div>
      </form>

      <div class="status">
        <span>安全访问已启用</span>
        <span>EvoX Robot Cloud</span>
      </div>
    </main>
  </div>

  <script>
    const form = document.querySelector('#loginForm');
    const input = document.querySelector('#token');
    const submit = document.querySelector('#submit');
    const error = document.querySelector('#error');

    function nextUrl(){
      const value = new URLSearchParams(location.search).get('next') || '';
      if (!value.startsWith('/') || value.startsWith('//') || value.includes('\\') || /[\u0000-\u001f]/.test(value)){
        return '/quadruped/fleet/';
      }
      return value;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const token = input.value.trim();
      if (!token) return;
      submit.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/auth/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ token }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok){
          throw new Error(payload.message || 'Token 验证失败');
        }
        location.replace(nextUrl());
      } catch (reason){
        error.textContent = reason?.message || 'Token 验证失败';
        input.select();
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
